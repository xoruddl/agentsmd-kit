# 규칙: docs/lint-and-ci.md
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json 의 packageManager 를 따른다
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 잠금 파일과 다르면 실패한다
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # 빌드 도구는 타입 오류가 있어도 빌드하는 경우가 많아 따로 검사한다
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
