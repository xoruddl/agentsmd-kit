# CodeRabbit 설정. 리뷰 반영 판단 기준은 docs/code-review.md
language: ko-KR

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.test.{ts,tsx}"
      instructions: "docs/testing.md 기준으로 리뷰한다. 구현 세부(state, 클래스 이름, 내부 구조)를 검사하는 테스트를 지적한다."
    - path: "**/*.{ts,tsx}"
      instructions: "docs/typescript.md, docs/structure.md, docs/env-and-security.md 기준으로 리뷰한다. any·타입 단언, 경계에서 검증하지 않은 외부 값, 접근성 누락을 지적한다."
    - path: "**/*.md"
      instructions: "docs/writing-style.md 기준. 서술형·장황한 문장을 지적한다."
