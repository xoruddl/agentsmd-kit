name: CI

on:
  pull_request:
  push:
    # 머지 결과가 깨지지 않았는지 머지된 뒤에도 확인한다
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 지원 범위의 최소 버전(22)과 현재 LTS를 함께 확인한다.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 패키지끼리 빌드 결과(dist)의 타입을 참조하므로 빌드를 먼저 한다.
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # 이 도구로 이 저장소의 AGENTS.md를 검사한다. 문서를 추가하고 지도를 고치지 않으면 여기서 실패한다.
      - name: agentsmd check
        run: node packages/cli/dist/main.js check

  # 루트 action.yml과 GitLab·Jenkins가 쓰는 이미지가 이 브랜치의 Dockerfile·코드로 빌드되고 동작하는지 확인한다.
  # 배포된 이미지를 당기는 `uses: ./`는 쓰지 않는다. 릴리스 전 브랜치에서는 그 이미지가 없기 때문이다.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t agentsmd:ci .
      # 통과해야 하는 저장소(이 저장소)와 실패해야 하는 저장소를 모두 돌려, 검사가 실제로 동작하는지 본다.
      - run: docker run --rm -v "$PWD:/repo" agentsmd:ci
      - run: |
          mkdir -p /tmp/bad/docs
          printf '# AGENTS.md\n\n## 문서 지도\n\n| 문서 | 언제 읽나 |\n| --- | --- |\n| [docs/a.md](docs/a.md) | 항상 |\n' > /tmp/bad/AGENTS.md
          touch /tmp/bad/docs/b.md
          # 이미지가 깨져 다른 코드로 죽는 경우와 구분하려고 종료 코드 1과 규칙 이름을 모두 확인한다.
          set +e
          output=$(docker run --rm -v /tmp/bad:/repo agentsmd:ci)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "위반이 있는 저장소에서 종료 코드 1을 기대했지만 $code 입니다" >&2
            exit 1
          fi
          echo "$output" | grep -q broken-link && echo "$output" | grep -q unlisted-doc
