name: CI

on:
  pull_request:
  push:
    # 머지 결과가 깨지지 않았는지 머지된 뒤에도 확인한다
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 지원 범위의 최소 버전(22)과 현재 LTS를 함께 확인한다.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 패키지끼리 빌드 결과(dist)의 타입을 참조하므로 빌드를 먼저 한다.
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      # 이 도구로 이 저장소의 AGENTS.md를 검사한다. 문서를 추가하고 지도를 고치지 않으면 여기서 실패한다.
      - name: agentsmd check
        run: node packages/cli/dist/main.js check

  # 사용자 저장소가 쓰는 루트 action.yml이 깨지지 않았는지 확인한다.
  # 위 job은 이 브랜치의 코드로, 이 job은 npm에 배포된 cli로 검사하므로 역할이 다르다.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          root: .
