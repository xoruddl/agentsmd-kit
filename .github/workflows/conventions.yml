name: Conventions

# PR의 브랜치 이름·제목·이슈 연결 규칙을 검사한다.
# 작업 PR(<타입>/<이슈번호>-<설명> → develop)은 셋 다, 릴리스 PR(develop → main)은 제목만 검사한다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # 룰셋의 필수 체크 이름이라 바꾸면 룰셋도 같이 고친다
  conventions:
    runs-on: ubuntu-latest
    steps:
      - name: 규칙 검사
        # PR 제목과 본문은 사용자가 쓴 값이라 스크립트에 직접 넣지 않고 환경변수로 넘긴다
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          # 브랜치 이름과 커밋 메시지는 소문자 타입, PR 제목은 대괄호로 감싼 타입을 쓴다
          TYPES: feat|fix|refactor|test|docs|chore|ci|build
          TITLE_TYPES: Feat|Fix|Refactor|Test|Docs|Chore|CI|Build
        run: |
          failed=0

          if [[ ! "$TITLE" =~ ^\[($TITLE_TYPES)\]\ .+ ]]; then
            echo "::error::PR 제목이 '[타입] 요약' 형식이 아닙니다 (예: [Feat] 요약): $TITLE"
            failed=1
          fi

          # 릴리스 PR은 여러 이슈를 묶어 옮기므로 브랜치 이름과 이슈 연결을 검사하지 않는다.
          if [[ "$BRANCH" == "develop" && "$BASE" == "main" ]]; then
            exit $failed
          fi

          if [[ ! "$BRANCH" =~ ^($TYPES)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::브랜치 이름이 '<타입>/<이슈번호>-<짧은-설명>' 형식이 아닙니다: $BRANCH"
            failed=1
          fi

          if ! grep -qiE '(^|[^[:alnum:]])closes #[0-9]+' <<< "$BODY"; then
            echo "::error::PR 본문에 'Closes #<이슈번호>'가 없습니다"
            failed=1
          fi

          exit $failed
