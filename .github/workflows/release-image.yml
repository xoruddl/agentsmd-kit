# cli 이미지를 ghcr.io/xoruddl/agentsmd 로 빌드·푸시한다. 루트 action.yml과 GitLab·Jenkins 사용자가 이 이미지를 쓴다.
# 릴리스 태그(v0.5.0)를 push하면 돌고, 처음 올리거나 다시 올릴 때는 수동으로 버전을 넣어 돌린다.
# 전체 릴리스 순서는 docs/release.md.
name: Release image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: 이미지 태그로 쓸 버전 (예 0.5.0). 현재 브랜치의 코드로 빌드한다
        required: true

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 태그 push면 v를 뗀 태그 이름, 수동 실행이면 입력한 버전을 쓴다.
      - id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.5.0, 0.5, latest 세 태그를 함께 올린다. action.yml은 0.5.0처럼 정확한 버전을 고정한다.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/xoruddl/agentsmd:${{ steps.version.outputs.full }}
            ghcr.io/xoruddl/agentsmd:${{ steps.version.outputs.minor }}
            ghcr.io/xoruddl/agentsmd:latest
